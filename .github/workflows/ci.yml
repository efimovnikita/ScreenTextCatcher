name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore ScreenTextCatcher.slnx

      - name: Build solution
        run: dotnet build ScreenTextCatcher.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test ScreenTextCatcher.slnx --configuration Release --no-build --verbosity normal
